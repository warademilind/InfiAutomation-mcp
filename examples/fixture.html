<!doctype html><html lang="en"><head><meta charset="utf-8"><title>TestWeave Lab</title><style>body{font:16px system-ui;background:#f5f6fa;padding:50px;color:#243047}main{background:white;max-width:650px;padding:32px;border-radius:16px}label{display:block;margin:14px 0}input,button,select{padding:10px;margin:4px}button{background:#6554c0;color:white;border:0;border-radius:6px}[role=menu]{padding:12px;border:1px solid #ccc}#status{padding:14px;color:#137b58}</style></head><body><main><h1>TestWeave Lab</h1><label>Project name <input id="project" data-testid="project" aria-label="Project name"></label><label><input type="checkbox" aria-label="Enable notifications">Enable notifications</label><label>Priority <select aria-label="Priority"><option value="normal">Normal</option><option value="high">High</option></select></label><button id="save-v2" data-testid="save" onclick="document.getElementById('status').textContent='Saved '+document.getElementById('project').value">Save project</button><p id="status" role="status" data-testid="status">Ready</p><div role="menubar"><button role="menuitem" aria-expanded="false" onclick="document.getElementById('file-menu').hidden=false;this.setAttribute('aria-expanded','true')">File</button></div><div role="menu" id="file-menu" hidden><button role="menuitem" onclick="document.getElementById('status').textContent='Export ready'">Export</button><button role="menuitem">Close menu</button></div></main></body></html>

name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
  web-electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm ci --prefix integration/fixtures/electron
      - run: npm run test:integration:web
      - run: node scripts/verify-report.mjs
      - run: xvfb-run -a npm run test:integration:electron
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: fixture-reports
          path: .testweave/runs/
          include-hidden-files: true
  native-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run build:native
      - run: dotnet build integration/fixtures/native/Fixture.csproj -c Release

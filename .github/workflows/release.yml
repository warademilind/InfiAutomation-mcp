name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify tag matches package
        run: node -e "if ('v'+JSON.parse(require('fs').readFileSync('package.json')).version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: npm pack
      - run: node scripts/verify-package.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: node-package
          path: testweave-mcp-*.tgz
  windows-worker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run build:native
      - run: Compress-Archive -Path native/publish/* -DestinationPath testweave-native-win-x64.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-worker
          path: testweave-native-win-x64.zip
  publish:
    needs: [package, windows-worker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: node-package
          path: release
      - uses: actions/download-artifact@v8.0.2
        with:
          name: windows-worker
          path: release
      - run: cd release && sha256sum *.tgz *.zip > SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --generate-notes

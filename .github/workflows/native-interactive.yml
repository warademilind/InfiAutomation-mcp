name: Native interactive verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    if: github.ref == 'refs/heads/main' && github.repository == 'warademilind/InfiAutomation-mcp' && github.actor == 'warademilind'
    runs-on: [self-hosted, Windows, infiautomation-interactive]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run build:native
      - run: dotnet build integration/fixtures/native/Fixture.csproj -c Release
      - run: npm run test:integration:native
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-fixture-evidence
          path: integration/output/
